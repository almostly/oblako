# Run on demand: uvx pre-commit run --all-files
# Install the git hooks: uvx pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen        # validate the message format: Service(+|~|-): description
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check        # lint (autofix); covers oblako/, tests/, examples/, notebooks
        args: [--fix]
      - id: ruff-format       # formatter; keeps boxed section-divider comments intact

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        # scope to the package; tests/examples/dashboard aren't docstring-checked.
        # pydocstyle asks for docstrings on public names only; tests/test_docstrings.py
        # asks for one on every def and class here, private and nested ones too
        files: ^oblako/.*\.py$
        exclude: ^oblako/dashboard/

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.47.1
    hooks:
      - id: cfn-lint
        # the tracked CloudFormation/SAM templates (build artifacts are gitignored)
        files: ^examples/python/(sam/template|ecs/infra/ecs-fargate-alb)\.yaml$
