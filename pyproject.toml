[project]
name = "oblako"
version = "0.1.0"
description = "Local AWS platform: Bedrock, SageMaker, Step Functions, and more, no cloud required"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "opensearch-py>=2.0",  # test_opensearch.py uses the OpenSearch client
    "redshift_connector>=2.1",  # test_redshift_proxy.py drives the redshift-connector driver
    "commitizen>=4",  # conventional-commit messages + `cz bump` version/changelog
]
agentcore = [
    "bedrock-agentcore>=0.1",
]
mysql = [
    "pymysql>=1.1",
]
notebook = [
    "jupyterlab>=4",
]
sagemaker = [
    # v2 SDK has classic local mode (LocalSession, Estimator instance_type="local");
    # v3 restructured the package and dropped it.
    # NOTE (accepted advisory): GHSA-5r2p-pjr8-7fh7 (HIGH) is only fixed in
    # sagemaker 3.4.0, which we can't take without losing local mode. The flaw is
    # an eval() in JumpStart *search*, a path oblako never exercises, so we hold
    # at <3 and accept it. Revisit if local mode returns to v3.
    "sagemaker>=2.200,<3",
    "pytz",  # sagemaker.workflow.pipeline imports it but doesn't always pull it in
]
mlflow = [
    # Local MLflow tracking server (oblako.engines.mlflow). Heavy dep tree, hence an extra.
    "mlflow>=3",
    # SigV4 auth plugin so boto3-style credentials work; keeps user code
    # identical to one targeting SageMaker's managed MLflow.
    "sagemaker-mlflow>=0.1",
]
iceberg = [
    # pyiceberg + pyarrow for writing/reading parquet via the local REST catalog.
    "pyiceberg[pyarrow,s3fs]>=0.7",
]
docs = [
    # Sphinx docs site (docs/), classic ReadTheDocs theme + Markdown via MyST.
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=3",
    "linkify-it-py>=2",
]

[project.scripts]
oblako = "oblako.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running oblako services (Docker)",
    "kubernetes: requires a Kubernetes cluster (minikube/kind)",
]

[tool.commitizen]
# Custom message format: `Service(<+|~|->): description`, where the symbol is what
# the change does to that service: + added, ~ changed, - removed. Example:
#   Redshift(+): add `oblako trust` for verified TLS
# `cz commit` prompts for service/kind/description; the commit-msg pre-commit hook
# validates the format; `cz bump` maps + -> minor, ~ -> patch, - -> minor.
name = "cz_customize"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
changelog_incremental = true          # prepend to CHANGELOG.md, keep the KaC header

[tool.commitizen.customize]
message_template = "{{service}}({{change}}): {{description}}"
example = "Redshift(+): add `oblako trust` for verified TLS"
schema = "<Service>(<+|~|->): <description>"
schema_pattern = "^[\\w .+/-]+\\([+~-]\\): .+"
bump_pattern = "^[\\w .+/-]+\\(([+~-])\\):"
# Changelog: Keep a Changelog (https://keepachangelog.com/en/1.1.0/). Parse each
# commit and group by section; + -> Added, ~ -> Changed, - -> Removed.
commit_parser = "^(?P<scope>[\\w .+/-]+)\\((?P<change_type>[+~-])\\): (?P<message>.+)"
changelog_pattern = "^[\\w .+/-]+\\([+~-]\\):"
change_type_order = ["Added", "Changed", "Removed"]

[tool.commitizen.customize.change_type_map]
"+" = "Added"
"~" = "Changed"
"-" = "Removed"

[tool.commitizen.customize.bump_map]
"+" = "MINOR"
"-" = "MINOR"
"~" = "PATCH"

[[tool.commitizen.customize.questions]]
type = "input"
name = "service"
message = "Service / component (e.g. Redshift, ECS, Glue, docs):"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change"
message = "What does this do to it?"
choices = [
    { value = "+", name = "+ : added" },
    { value = "~", name = "~ : changed" },
    { value = "-", name = "- : removed" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "description"
message = "Short description of the change:"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oblako"]
# The React app lives at oblako/dashboard/frontend; ship the built dist (so a
# pip-installed `oblako dashboard` can serve the UI) but never the node toolchain
# or sources.
exclude = [
    "oblako/dashboard/frontend/node_modules",
    "oblako/dashboard/frontend/src",
    "oblako/dashboard/frontend/*.js",
    "oblako/dashboard/frontend/*.json",
    "oblako/dashboard/frontend/*.html",
]
