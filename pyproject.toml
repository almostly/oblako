[project]
name = "oblako"
version = "0.1.0"
description = "Local AWS platform: Bedrock, SageMaker, Step Functions, and more — no cloud required"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "opensearch-py>=2.0",  # test_opensearch.py uses the OpenSearch client
    "redshift_connector>=2.1",  # test_redshift_proxy.py drives the redshift-connector driver
]
agentcore = [
    "bedrock-agentcore>=0.1",
]
mysql = [
    "pymysql>=1.1",
]
notebook = [
    "jupyterlab>=4",
]
sagemaker = [
    # v2 SDK has classic local mode (LocalSession, Estimator instance_type="local");
    # v3 restructured the package and dropped it.
    # NOTE (accepted advisory): GHSA-5r2p-pjr8-7fh7 (HIGH) is only fixed in
    # sagemaker 3.4.0, which we can't take without losing local mode. The flaw is
    # an eval() in JumpStart *search*, a path oblako never exercises, so we hold
    # at <3 and accept it. Revisit if local mode returns to v3.
    "sagemaker>=2.200,<3",
    "pytz",  # sagemaker.workflow.pipeline imports it but doesn't always pull it in
]
mlflow = [
    # Local MLflow tracking server (oblako.engines.mlflow). Heavy dep tree, hence an extra.
    "mlflow>=3",
    # SigV4 auth plugin so boto3-style credentials work — keeps user code
    # identical to one targeting SageMaker's managed MLflow.
    "sagemaker-mlflow>=0.1",
]
iceberg = [
    # pyiceberg + pyarrow for writing/reading parquet via the local REST catalog.
    "pyiceberg[pyarrow,s3fs]>=0.7",
]

[project.scripts]
oblako = "oblako.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running oblako services (Docker)",
    "kubernetes: requires a Kubernetes cluster (minikube/kind)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oblako"]
# The React app lives at oblako/dashboard/frontend; ship the built dist (so a
# pip-installed `oblako dashboard` can serve the UI) but never the node toolchain
# or sources.
exclude = [
    "oblako/dashboard/frontend/node_modules",
    "oblako/dashboard/frontend/src",
    "oblako/dashboard/frontend/*.js",
    "oblako/dashboard/frontend/*.json",
    "oblako/dashboard/frontend/*.html",
]
