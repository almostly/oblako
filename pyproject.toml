[project]
name = "oblako"
version = "0.1.0"
description = "Local AWS platform: Bedrock, SageMaker, Step Functions, and more, no cloud required"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Almostly" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "boto3>=1.43.64",  # DynamoDB vector search (SearchVectors) in the model
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",  # modern driver (Firehose Redshift-destination COPY)
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "opensearch-py>=2.0",  # test_opensearch.py uses the OpenSearch client
    "redshift_connector>=2.1",  # test_redshift_proxy.py drives the redshift-connector driver
    "sqlalchemy-redshift>=0.8",  # test_redshift_sqlalchemy.py drives the dialect's reflection
    "alembic>=1.13",  # test_redshift_sqlalchemy.py runs autogenerate's comparison
    "pyarrow>=14",  # test_redshift_copy_unload.py verifies the COPY/UNLOAD <-> S3 bridge
    "awswrangler>=3",  # test_redshift_copy_unload.py exercises wr.redshift.copy/unload
    "sqlglot>=25",  # test_redshift_pivot_unit.py + the proxy's PIVOT/UNPIVOT rewrite
    "commitizen>=4",  # conventional-commit messages + `cz bump` version/changelog
]
agentcore = [
    "bedrock-agentcore>=0.1",
]
mysql = [
    "pymysql>=1.1",
]
parquet = [
    # Firehose record format conversion (JSON -> Parquet)
    "pyarrow>=14",
]
notebook = [
    "jupyterlab>=4",
]
sagemaker = [
    # Client-side only: oblako runs training/serving containers itself (the
    # /opt/ml contract, see SageMakerService), so its execution doesn't depend on
    # the SageMaker SDK. This extra is for user code / examples that drive the SDK
    # against oblako, and for the account-free local stubs. v3 keeps local mode
    # (LocalSession moved to sagemaker.core.local; ModelTrainer/ModelBuilder add a
    # Mode.LOCAL_CONTAINER enum). >=3.4 also clears GHSA-5r2p-pjr8-7fh7.
    "sagemaker>=3.4,<4",
    "botocore[crt]",  # v3 login credential provider needs the CRT extra
    # Automatic Model Tuning (create_hyper_parameter_tuning_job) runs Syne Tune's
    # TPE as the internal searcher; optional, oblako falls back to random search
    # when it's absent, so this stays in the extra rather than a core dep.
    "syne-tune>=0.13",
]
mlflow = [
    # Local MLflow tracking server (oblako.engines.mlflow). Heavy dep tree, hence an extra.
    "mlflow>=3",
    # SigV4 auth plugin so boto3-style credentials work; keeps user code
    # identical to one targeting SageMaker's managed MLflow.
    "sagemaker-mlflow>=0.1",
]
iceberg = [
    # pyiceberg + pyarrow for writing/reading parquet via the local REST catalog.
    "pyiceberg[pyarrow,s3fs]>=0.7",
]
docs = [
    # Sphinx docs site (docs/), classic ReadTheDocs theme + Markdown via MyST.
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=3",
    "linkify-it-py>=2",
]

[project.scripts]
oblako = "oblako.cli:main"

[project.urls]
Homepage = "https://oblako-sdk.almostly.ai/"
Documentation = "https://oblako-sdk.almostly.ai/"
Repository = "https://github.com/almostly/oblako"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Ruff's classic default rules, written out so that every ruff version (the
# pre-commit pin, an editor's, `uvx ruff`) checks the same set
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
# Stubs for packages that only example containers install (see typings/)
extra-paths = ["typings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running oblako services (Docker)",
    "kubernetes: requires a Kubernetes cluster (minikube/kind)",
    "cluster: requires the redshift-cluster image (Redshift multi-node)",
    "mwaa: builds AWS's Airflow image and runs MWAA environments (local only)",
]

[tool.commitizen]
# Custom message format: `Service(<+|~|->): description`, where the symbol is what
# the change does to that service: + added, ~ changed, - removed. Example:
#   Redshift(+): add `oblako trust` for verified TLS
# `cz commit` prompts for service/kind/description; the commit-msg pre-commit hook
# validates the format; `cz bump` maps + -> minor, ~ -> patch, - -> minor.
name = "cz_customize"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
changelog_incremental = true          # prepend to CHANGELOG.md, keep the KaC header

[tool.commitizen.customize]
message_template = "{{service}}({{change}}): {{description}}"
example = "Redshift(+): add `oblako trust` for verified TLS"
schema = "<Service>(<+|~|->): <description>"
schema_pattern = "^[\\w .+/-]+\\([+~-]\\): .+"
bump_pattern = "^[\\w .+/-]+\\(([+~-])\\):"
# Changelog: Keep a Changelog (https://keepachangelog.com/en/1.1.0/). Parse each
# commit and group by section; + -> Added, ~ -> Changed, - -> Removed.
commit_parser = "^(?P<scope>[\\w .+/-]+)\\((?P<change_type>[+~-])\\): (?P<message>.+)"
changelog_pattern = "^[\\w .+/-]+\\([+~-]\\):"
change_type_order = ["Added", "Changed", "Removed"]

[tool.commitizen.customize.change_type_map]
"+" = "Added"
"~" = "Changed"
"-" = "Removed"

[tool.commitizen.customize.bump_map]
"+" = "MINOR"
"-" = "MINOR"
"~" = "PATCH"

[[tool.commitizen.customize.questions]]
type = "input"
name = "service"
message = "Service / component (e.g. Redshift, ECS, Glue, docs):"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change"
message = "What does this do to it?"
choices = [
    { value = "+", name = "+ : added" },
    { value = "~", name = "~ : changed" },
    { value = "-", name = "- : removed" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "description"
message = "Short description of the change:"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oblako"]
# The React app lives at oblako/dashboard/frontend; ship the built dist (so a
# pip-installed `oblako dashboard` can serve the UI) but never the node toolchain
# or sources.
exclude = [
    "oblako/dashboard/frontend/node_modules",
    "oblako/dashboard/frontend/src",
    "oblako/dashboard/frontend/*.js",
    "oblako/dashboard/frontend/*.json",
    "oblako/dashboard/frontend/*.html",
]
