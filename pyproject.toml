[project]
name = "oblako"
version = "0.1.0"
description = "Local AWS platform: Bedrock, SageMaker, Step Functions, and more — no cloud required"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "docker>=7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "opensearch-py>=2.0",  # test_opensearch.py uses the OpenSearch client
]
agentcore = [
    "bedrock-agentcore>=0.1",
]
mysql = [
    "pymysql>=1.1",
]
notebook = [
    "jupyterlab>=4",
]
sagemaker = [
    # v2 SDK has classic local mode (LocalSession, Estimator instance_type="local");
    # v3 restructured the package and dropped it.
    "sagemaker>=2.200,<3",
]

[project.scripts]
oblako = "oblako.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oblako"]
