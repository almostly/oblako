name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint (ruff)
        run: uv run --python 3.12 --extra dev ruff check oblako tests

      # Docker-free subset (parsing, inference math, in-process servers).
      - name: Unit tests
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          tests/bedrock/test_bedrock_adapter.py
          tests/bedrock/test_bedrock_backends.py
          tests/services/test_services.py
          tests/services/test_backends.py
          tests/services/test_config.py
          tests/redshift/test_redshift_ml_unit.py
          tests/cloudformation/test_cloudformation.py
          tests/notebook/test_notebook.py
          tests/stepfunctions/test_sfn_templates.py
          tests/iam/test_iam_evaluator.py
          tests/services/test_mlflow.py

  integration:
    name: integration tests (Docker services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Start the oblako services and wait for readiness (up to 180s each, for
      # image pulls + DB/JVM init — OpenSearch is the slow one). Heavier tiers —
      # Ollama/Bedrock and SageMaker local — are still not run here (see
      # NEXT_STEPS): they need large model downloads / extra build steps.
      - name: Start services
        run: >
          uv run --python 3.12 --extra dev python -c "from oblako.services import Oblako as O; import sys;
          o = O(); svcs = [o.s3, o.dynamodb, o.moto, o.stepfunctions, o.redshift, o.rds, o.opensearch];
          [s.start() for s in svcs];
          r = {s.name: s.wait_ready(timeout=180) for s in svcs};
          print('ready:', r); sys.exit(0 if all(r.values()) else 1)"

      # MySQL (test_rds_data mysql cases) isn't started, so those skip; the Step
      # Functions tests use Pass-only state machines (no Lambda).
      - name: Integration tests
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          tests/s3/test_s3proxy.py
          tests/stepfunctions/test_stepfunctions.py
          tests/redshift/test_redshift.py
          tests/redshift/test_redshift_data.py
          tests/rds/test_rds.py
          tests/rds/test_rds_data.py
          tests/opensearch/test_opensearch.py
          tests/cloudformation/test_cloudformation.py

  kubernetes:
    name: kubernetes backend (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Provision a real cluster so the Kubernetes backend's run/port-forward path
      # (not just the manifest builder) is exercised end to end.
      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Kubernetes backend test
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          tests/services/test_k8s_backend.py
