name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint (ruff)
        run: uv run --python 3.12 --extra dev ruff check oblako tests

      # Docker-free subset: anything not auto-marked `integration` or `kubernetes`
      # by tests/conftest.py is picked up — new tests Just Work without ci.yml edits.
      - name: Unit tests
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          -m "not integration and not kubernetes"

  integration:
    name: integration tests (Docker services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sagemaker extra pulls in torch + CUDA wheels (via sagemaker-serve),
      # several GB, and the tests then build training images; without room the
      # image builds fail in pip. The runner image ships toolchains this job
      # never uses, so drop them first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Build the redshift image from source and tag it as the pull target, so
      # integration tests run against the code under change (RedshiftService uses
      # the local image when present, no pull). Closes the publish-lag gap where
      # an image change lands before the registry republishes.
      - name: Build redshift image
        run: docker build -t public.ecr.aws/oblako/redshift-local:16 oblako/images/redshift

      # Start the oblako services and wait for readiness (up to 180s each, for
      # image pulls + DB/JVM init; OpenSearch is the slow one). Trino also starts
      # the Glue engine, its awsdatacatalog metastore. Ollama/Bedrock
      # is not run here: it needs large model downloads. The sagemaker extra
      # (the v3 SDK) lets the SageMaker SDK tests drive its local modes.
      - name: Start services
        run: >
          uv run --python 3.12 --extra dev --extra sagemaker python -c "from oblako.services import Oblako as O; import sys;
          o = O(); svcs = [o.s3, o.dynamodb, o.moto, o.stepfunctions, o.redshift, o.rds, o.opensearch, o.iceberg, o.trino];
          [s.start() for s in svcs];
          r = {s.name: s.wait_ready(timeout=180) for s in svcs};
          print('ready:', r); sys.exit(0 if all(r.values()) else 1)"

      # MySQL (test_rds_data mysql cases) isn't started, so those skip; the Step
      # Functions tests use Pass-only state machines (no Lambda).
      - name: Integration tests
        run: >
          uv run --python 3.12 --extra dev --extra sagemaker python -m pytest -v
          -m integration

      - name: Disk usage after tests
        if: always()
        run: df -h /

  redshift-cluster:
    name: redshift MPP cluster (Citus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The cluster image builds FROM the single-node image (COPY --from), so
      # build + tag that first; buildkit then resolves it from the local store.
      - name: Build redshift image
        run: docker build -t public.ecr.aws/oblako/redshift-local:16 oblako/images/redshift

      # Coordinator + 2 workers, named explicitly so compose starts only the
      # cluster (a bare `--profile cluster up` would also start the single-node
      # `redshift` service, colliding on 5439). Runners are amd64: Citus native.
      - name: Build + start the Citus cluster
        run: >
          docker compose --profile cluster up -d --build
          redshift-coordinator redshift-w1 redshift-w2

      - name: Wait for the workers to register
        run: |
          for i in $(seq 1 60); do
            n=$(docker compose exec -T redshift-coordinator \
                  psql -U oblako -d oblako -h 127.0.0.1 -p 5433 -tAc \
                  "SELECT count(*) FROM pg_dist_node WHERE isactive" 2>/dev/null \
                  | tr -d '[:space:]')
            echo "active Citus nodes: ${n:-0}"
            [ "${n:-0}" -ge 3 ] && exit 0
            sleep 3
          done
          echo "cluster did not form"; docker compose logs redshift-coordinator | tail -40; exit 1

      - name: Cluster tests
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          tests/redshift/test_redshift_cluster.py

  kubernetes:
    name: kubernetes backend (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Provision a real cluster so the Kubernetes backend's run/port-forward path
      # (not just the manifest builder) is exercised end to end.
      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Kubernetes backend test
        run: >
          uv run --python 3.12 --extra dev python -m pytest -v
          -m kubernetes
