name: docs

# Build the Sphinx site and publish it to S3 + CloudFront
# (https://oblako-sdk.almostly.ai/). Authenticates via GitHub OIDC to the
# least-privilege role `oblako-docs-deploy` (no static AWS keys).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "oblako/services/**"        # api.md autodocs the service classes
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for GitHub OIDC -> AWS

concurrency:
  group: docs
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_TARGET: s3://oblako-public/docs/
  DISTRIBUTION_ID: E9NGABBAAK9CF

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build the Sphinx site
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN kept in a repo secret so the account ID isn't in the
          # public source (and is masked in Actions logs). Value:
          #   arn:aws:iam::<account-id>:role/oblako-docs-deploy
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        # book/ holds "A Data Guide to AWS on oblako", uploaded separately; keep it
        run: aws s3 sync docs/_build/html "$S3_TARGET" --delete --exclude "book/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
