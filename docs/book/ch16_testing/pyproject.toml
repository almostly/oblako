[project]
name = "daily-totals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3[crt]", "pyarrow", "redshift-connector"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = ["integration: needs oblako (or AWS) to be running"]
# redshift_connector builds its SSL context in a deprecated way
filterwarnings = ["ignore::DeprecationWarning:redshift_connector"]
