services:
  # Bedrock, powered by the Ollama engine.
  bedrock:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  opensearch:
    image: opensearchproject/opensearch:2
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Amazon Redshift on oblako's own PostgreSQL-16 image: a shared_preload
  # extension makes redshift-connector (dbt-redshift) connect natively (no
  # proxy) by accepting its startup GUCs and reporting server_version 8.0.2.
  # Pulls the published image; `build` lets `docker compose build` produce it
  # locally too. See oblako/images/redshift.
  redshift:
    image: public.ecr.aws/oblako/redshift-local:16
    build: ./oblako/images/redshift
    ports:
      - "5439:5439"
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
      POSTGRES_HOST_AUTH_METHOD: md5
      # Where the in-engine COPY/UNLOAD bridge reaches the object store. Points at
      # the S3Proxy service on the compose network; unset (standalone `docker run`)
      # it falls back to real AWS, so a genuine s3:// with real creds also works.
      OBLAKO_S3_ENDPOINT: http://s3proxy:80
    volumes:
      - redshift_data:/var/lib/postgresql/data
      # Redshift ML: CREATE MODEL trains in a container on the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock

  # Redshift MPP cluster (opt-in `cluster` profile): the same Redshift-compatible
  # engine on Citus, so tables shard across worker nodes for real multi-node
  # parallelism. Start with `docker compose --profile cluster up`. The coordinator
  # is what clients connect to (it also publishes 5439, so run it INSTEAD of the
  # single-node `redshift` service, not alongside). The image builds FROM the
  # single-node redshift image and compiles Citus, so it is native on amd64 and
  # arm64. (Through oblako's Redshift API, create_cluster(ClusterType=
  # 'multi-node') starts a cluster like this one without compose.)
  redshift-coordinator:
    profiles: ["cluster"]
    image: public.ecr.aws/oblako/redshift-cluster:16
    build: ./oblako/images/redshift-cluster
    ports:
      - "5439:5439"
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
      # trust across the isolated cluster network (inter-node + client); the
      # proxy still presents Redshift's version on the wire.
      POSTGRES_HOST_AUTH_METHOD: trust
      OBLAKO_CITUS_ROLE: coordinator
      OBLAKO_CITUS_COORDINATOR_HOST: redshift-coordinator
      OBLAKO_CITUS_WORKERS: redshift-w1,redshift-w2
    depends_on:
      - redshift-w1
      - redshift-w2

  redshift-w1:
    profiles: ["cluster"]
    image: public.ecr.aws/oblako/redshift-cluster:16
    build: ./oblako/images/redshift-cluster
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
      POSTGRES_HOST_AUTH_METHOD: trust
      OBLAKO_CITUS_ROLE: worker

  redshift-w2:
    profiles: ["cluster"]
    image: public.ecr.aws/oblako/redshift-cluster:16
    build: ./oblako/images/redshift-cluster
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
      POSTGRES_HOST_AUTH_METHOD: trust
      OBLAKO_CITUS_ROLE: worker

  # RDS / Aurora data-plane engine (control plane is moto's 'rds' API).
  rds:
    # PostgreSQL 16 with pgvector, pinned; see oblako/services/rds.py.
    image: pgvector/pgvector@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
    volumes:
      - rds_data:/var/lib/postgresql/data

  # Control plane (Redshift clusters, RDS/Aurora instances+clusters) via moto.
  moto:
    image: motoserver/moto:latest
    ports:
      - "5500:5000"

  s3proxy:
    image: andrewgaul/s3proxy:s3proxy-4.1.1  # pinned: see oblako/services/s3proxy.py
    ports:
      - "9000:80"
    environment:
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      S3PROXY_AUTHORIZATION: none
    volumes:
      - s3_data:/data

  dynamodb:
    image: amazon/dynamodb-local:latest
    # -sharedDb -dbPath makes dynamodb-local actually persist to the volume;
    # user: root so it can write to the root-owned named volume.
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  kinesis:
    # Pinned by digest; see oblako/services/kinesis.py.
    image: saidsef/aws-kinesis-local@sha256:a1f2be9d4356a024113bf199a0d1a352fa0d10420f35ab2f52a5d08f5920b8c9
    environment:
      PORT: "4567"
      KPATH: /data
      SHARDLIMIT: "100"
    ports:
      - "4567:4567"
    volumes:
      - kinesis_data:/data

  stepfunctions:
    image: amazon/aws-stepfunctions-local:latest
    ports:
      - "8083:8083"
    environment:
      - LAMBDA_ENDPOINT=http://host.docker.internal:3001

volumes:
  ollama_data:
  opensearch_data:
  redshift_data:
  rds_data:
  s3_data:
  dynamodb_data:
  kinesis_data:
