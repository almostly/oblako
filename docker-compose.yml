services:
  # Bedrock, powered by the Ollama engine.
  bedrock:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  opensearch:
    image: opensearchproject/opensearch:2
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # Raw pgredshift engine (PostgreSQL 10 + Redshift system tables). It sits
  # behind the redshift proxy; published on 5438 for direct psql/debug access.
  pgredshift:
    image: hearthsim/pgredshift:latest
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
    volumes:
      - redshift_data:/var/lib/postgresql/data

  # Redshift endpoint, on Redshift's port 5439: a Postgres-wire proxy that fixes
  # the startup handshake so the redshift-connector driver (used by dbt-redshift)
  # connects (pgredshift would otherwise reject it), and passes psycopg2 through
  # untouched. See oblako/engines/redshift_proxy.
  redshift:
    image: python:3.12-slim
    depends_on:
      - pgredshift
    ports:
      - "5439:5439"
    environment:
      OBLAKO_RS_PROXY_LISTEN: "5439"
      OBLAKO_RS_PROXY_BACKEND_HOST: pgredshift
      OBLAKO_RS_PROXY_BACKEND_PORT: "5432"
    volumes:
      - ./oblako/engines/redshift_proxy/__init__.py:/proxy.py:ro
    command: ["python", "/proxy.py"]

  # RDS / Aurora data-plane engine (control plane is moto's 'rds' API).
  rds:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oblako
      POSTGRES_PASSWORD: oblako
      POSTGRES_DB: oblako
    volumes:
      - rds_data:/var/lib/postgresql/data

  # Control plane (Redshift clusters, RDS/Aurora instances+clusters) via moto.
  moto:
    image: motoserver/moto:latest
    ports:
      - "5500:5000"

  s3proxy:
    image: andrewgaul/s3proxy:latest
    ports:
      - "9000:80"
    environment:
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      S3PROXY_AUTHORIZATION: none
    volumes:
      - s3_data:/data

  dynamodb:
    image: amazon/dynamodb-local:latest
    # -sharedDb -dbPath makes dynamodb-local actually persist to the volume;
    # user: root so it can write to the root-owned named volume.
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  stepfunctions:
    image: amazon/aws-stepfunctions-local:latest
    ports:
      - "8083:8083"
    environment:
      - LAMBDA_ENDPOINT=http://host.docker.internal:3001

volumes:
  ollama_data:
  opensearch_data:
  redshift_data:
  rds_data:
  s3_data:
  dynamodb_data:
